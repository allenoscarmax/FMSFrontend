; ================================================
; FMSFrontend Base Setting
; 說明：
; 1) 可直接修改此檔案來調整系統啟動參數
; 2) 布林值請使用 True / False
; 3) 修改後重新啟動程式
; ================================================

[Param]
; 語言：0=繁體中文, 1=English, 2=日本語
Language=0

; 後端主機 IP（例如 127.0.0.1 / 192.168.1.100 / localhost）
IP=127.0.0.1

; Demo 模式：True=使用 DemoHttpService, False=使用正式 HttpService
DemoMode=True

; 是否保持登入
KeepLoggedIn=False

; MainWindow：True=小型倉儲控制頁, False=詳細倉儲控制頁
IsStorageUnitControlMini=True

; ProductionLines：True=總覽頁, False=詳細頁
IsStorageOverviewControl=True

; 機械手臂維護日期（yyyy/MM/dd）
RobotMaintenanceMsg=

; (保留) 站點數量，若有需要再啟用
StationCount=0

[Login]
; 上次登入使用者名稱
LastLoginName=admin
